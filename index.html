<!DOCTYPE html>
<html lang="es">

  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <main class="muro">
    <section class="artistas-grid">

      <a href="artistas/artista2.html" class="artista-card">

        </div>

  <footer class="footer">
